<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marca.storre</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, 'Inter', sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #111);
            padding-bottom: 90px;
        }

        /* ===== ШАПКА ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: var(--tg-theme-bg-color, #fff);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.8px;
            text-transform: lowercase;
        }
        .header-icons { display: flex; gap: 16px; align-items: center; }
        .header-icons svg {
            width: 22px; height: 22px;
            stroke: var(--tg-theme-text-color, #111);
            fill: none; stroke-width: 1.8;
        }
        .cart-icon-wrap { position: relative; cursor: pointer; }
        .cart-badge {
            position: absolute;
            top: -6px; right: -8px;
            background: #111; color: #fff;
            font-size: 10px; font-weight: 700;
            min-width: 16px; height: 16px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
        }

        /* ===== БАННЕР ===== */
        .hero { position: relative; margin-bottom: 28px; }
        .hero img {
            width: 100%; height: 420px;
            object-fit: cover; display: block;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.1));
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 48px;
        }
        .hero-text { text-align: center; color: #fff; padding: 0 20px; }
        .hero-logo {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: lowercase;
            margin-bottom: 6px;
            text-shadow: 0 2px 24px rgba(0,0,0,0.7);
        }
        .hero-tagline {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 24px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
            opacity: 0.9;
        }
        .hero-btn {
            background: #fff;
            color: #111;
            border: none;
            padding: 14px 32px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* ===== СЕКЦИИ ===== */
        .section { margin-bottom: 36px; }
        .section-title {
            font-size: 20px;
            font-weight: 800;
            padding: 0 16px;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        /* ===== КАРУСЕЛЬ ===== */
        .carousel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 16px 8px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .carousel::-webkit-scrollbar { display: none; }
        .carousel .card { flex: 0 0 46%; scroll-snap-align: start; }

        /* ===== СЕТКА ===== */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 12px;
            padding: 0 16px;
        }

        /* ===== КАРТОЧКА ===== */
        .card { cursor: pointer; }
        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f2f2f2;
            overflow: hidden;
        }
        .card img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .card-info { padding-top: 10px; }
        .card h3 {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.35;
            margin-bottom: 4px;
        }
        .card .price {
            font-size: 15px;
            font-weight: 700;
        }
        .card-add {
            position: absolute;
            bottom: 8px; right: 8px;
            width: 34px; height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.95);
            color: #111;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* ===== КНОПКА VIEW ALL ===== */
        .view-all-wrap { text-align: center; margin-top: 22px; padding: 0 16px; }
        .view-all {
            background: #111;
            color: #fff;
            border: none;
            padding: 14px 36px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #111;
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 60;
        }
        .bottom-bar .info { font-size: 13px; font-weight: 600; }
        .bottom-bar .btn {
            background: #fff;
            color: #111;
            border: none;
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* ===== КАТЕГОРИИ ===== */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 16px 16px;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 20px;
            background: transparent;
            color: var(--tg-theme-text-color, #111);
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        /* ===== МОДАЛКА КОРЗИНЫ ===== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: flex-end;
            z-index: 100;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #111);
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            border-radius: 18px 18px 0 0;
            padding: 20px 16px 24px;
        }
        .modal-content h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .cart-item img {
            width: 56px; height: 56px;
            object-fit: cover;
            border-radius: 4px;
            background: #f2f2f2;
        }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .cart-item-info span { font-size: 13px; opacity: 0.7; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-controls button {
            width: 28px; height: 28px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 50%;
            background: transparent;
            color: var(--tg-theme-text-color, #111);
            font-size: 16px;
            cursor: pointer;
        }
        .modal-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 800;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid #111;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }
        .btn-close {
            background: transparent;
            color: var(--tg-theme-text-color, #111);
            border: 1px solid rgba(0,0,0,0.2) !important;
        }
        .btn-pay { background: #111; color: #fff; }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <div class="logo">marca.storre</div>
        <div class="header-icons">
            <div class="cart-icon-wrap" id="cartIconBtn">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
        </div>
    </header>

    <!-- БАННЕР -->
    <section class="hero">
        <img src="https://i.postimg.cc/L5pdCyjf/file-00000000843081f4949eca92cc4b28dc.png">
        <div class="hero-overlay">
            <div class="hero-text">
                <h1 class="hero-logo">marca.storre</h1>
                <p class="hero-tagline">Одежда с характером</p>
                <button class="hero-btn" onclick="document.getElementById('allProducts').scrollIntoView({behavior:'smooth'})">Shop Now</button>
            </div>
        </div>
    </section>

    <!-- НОВИНКИ -->
    <section class="section">
        <h2 class="section-title">Новинки</h2>
        <div class="carousel" id="newProducts"></div>
    </section>

    <!-- КАТЕГОРИИ -->
    <section class="section">
        <h2 class="section-title">Категории</h2>
        <div class="categories" id="categories"></div>
    </section>

    <!-- ВСЕ ТОВАРЫ -->
    <section class="section" id="allProducts">
        <h2 class="section-title">Все товары</h2>
        <div class="grid" id="products"></div>
        <div class="view-all-wrap" id="viewAllWrap" style="display:none;">
            <button class="view-all" id="viewAllBtn">View all</button>
        </div>
    </section>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar" id="bottomBar">
        <div class="info"><span id="barCount">0</span> товаров · <span id="barTotal">0</span> ₽</div>
        <button class="btn" id="openCartBtn">Корзина</button>
    </div>

    <!-- КОРЗИНА -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h2>Корзина</h2>
            <div id="cartItems"></div>
            <div class="modal-total">
                <span>Итого:</span>
                <span id="modalTotal">0 ₽</span>
            </div>
            <div class="modal-actions">
                <button class="btn-close" id="closeCartBtn">Закрыть</button>
                <button class="btn-pay" id="checkoutBtn">Оформить заказ</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
